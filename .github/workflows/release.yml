name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # MCPWA_STATIC_RUNTIME links the CRT statically, so the published exe
      # runs on a machine with no Visual C++ redistributable installed.
      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DMCPWA_BUILD_TESTS=ON -DMCPWA_STATIC_RUNTIME=ON

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage the artifacts
        shell: cmd
        run: |
          mkdir dist
          copy build\Release\mcp-winauth-bridge.exe dist\
          cd dist
          certutil -hashfile mcp-winauth-bridge.exe SHA256 > SHA256SUMS.txt
          type SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes dist/*
