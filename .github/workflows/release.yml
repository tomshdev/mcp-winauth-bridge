name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Ninja plus a developer environment: the hosted image's VS major
      # version moves, so the generator is not pinned to one. The action is
      # pinned to a commit rather than its floating v1 tag.
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64

      # MCPWA_STATIC_RUNTIME links the CRT statically, so the published exe
      # runs on a machine with no Visual C++ redistributable.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DMCPWA_BUILD_TESTS=ON
          -DMCPWA_STATIC_RUNTIME=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # A real sha256sum-format file, so `sha256sum -c SHA256SUMS.txt` works.
      # certutil's output has a header and a trailer and is not checkable.
      - name: Stage the artifacts
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\mcp-winauth-bridge.exe dist\
          $hash = (Get-FileHash dist\mcp-winauth-bridge.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  mcp-winauth-bridge.exe" | Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      # The assets are named one by one: PowerShell does not expand globs for
      # native commands, so `dist/*` would reach gh as a literal path.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}" --generate-notes
          dist/mcp-winauth-bridge.exe
          dist/SHA256SUMS.txt
