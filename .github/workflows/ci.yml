name: ci

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:

# Ninja plus a developer environment, rather than a pinned "Visual Studio 17
# 2022" generator: the hosted image's VS major version moves, and this also
# makes CI build exactly the way the local scripts\dev-build.cmd does.
# msvc-dev-cmd is pinned to a commit rather than its floating v1 tag.
jobs:
  build-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DMCPWA_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The pool, the session gate and the shutdown drain are timing-sensitive.
      # Once is not enough to trust them.
      - name: Test repeatedly (shake out races)
        run: ctest --test-dir build --output-on-failure --repeat until-fail:20

      - name: Smoke the exe
        run: .\build\mcp-winauth-bridge.exe --version

      # Consumption mode (b): a separate project resolves the installed package
      # and links it. Fails if the export set, the include layout or the
      # winhttp propagation is wrong.
      - name: Install and build the example consumer
        run: |
          cmake --install build --prefix "${{ github.workspace }}\stage"
          cmake -S examples/consumer -B build-consumer -G Ninja `
                -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
                -DCMAKE_PREFIX_PATH="${{ github.workspace }}\stage"
          cmake --build build-consumer
          .\build-consumer\consumer.exe

      - name: Upload the release binary
        if: matrix.config == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: mcp-winauth-bridge-x64
          path: build/mcp-winauth-bridge.exe

  # Consumption mode (c): the sources dropped straight into another project,
  # no CMake at all. This also catches windows.h leaking out of a public header.
  dropin-sources:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Compile the sources directly
        shell: cmd
        run: |
          cl /nologo /std:c++17 /EHsc /W4 /permissive- /utf-8 /Zc:preprocessor ^
             /DUNICODE /D_UNICODE /DNOMINMAX /DWIN32_LEAN_AND_MEAN ^
             /Iinclude /Isrc /Fedropin.exe ^
             src\*.cpp app\main.cpp winhttp.lib
          .\dropin.exe --version
